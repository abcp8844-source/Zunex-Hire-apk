name: Auto Fix Import Paths

on:
  workflow_dispatch:

# اس سیکشن کے ذریعے GitHub Actions کو رائٹ (Write) کی اجازت ملتی ہے
permissions:
  contents: write

jobs:
  fix-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Path Migration Script
        run: python fix_paths.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "Automated: Migrated import paths to new folders"
          git push
