name: Build React Native APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm cache clean --force
          rm -f package-lock.json
          npm install --legacy-peer-deps

      - name: Make env file from GitHub Secrets
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Generate Android Environment & Fix Versions
        run: |
          npx expo prebuild --platform android --clean
          if [ -f "android/build.gradle" ]; then
            sed -i 's/1.9.24/1.9.25/g' android/build.gradle || true
          fi

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zunex-release-apk
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/apk/release/*.apk
