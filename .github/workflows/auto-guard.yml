name: Production Guard

on:
  push:
    branches: [ "*" ]

permissions:
  contents: write

jobs:
  code-sanitizer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linter
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Python Audit and Fix
        run: |
          ruff check . --fix

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Handle Node Packages and Build
        run: |
          if [ -f "package.json" ]; then
            npm install
            npm run build --if-present
          fi

      - name: Commit Fixed Code Back to Repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-Guard: Fixed syntax, imports, and packages."
          push_options: '--force'
